<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sqservices.me — Library</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #080c18;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #e8eeff;
        }

        .container {
            width: 100%;
            max-width: 1080px;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 48px;
            gap: 40px;
        }

        /* ===== LEFT ===== */
        .left {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 8px;
        }

        .company {
            font-size: 2.7rem;
            font-weight: 700;
            letter-spacing: -1.2px;
            color: #ffffff;
            line-height: 1.1;
        }

        .company span {
            color: #5b9bff;
        }

        .library {
            font-size: 1.15rem;
            font-weight: 500;
            color: #7d94c4;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .divider {
            width: 48px;
            height: 3px;
            background: linear-gradient(90deg, #5b9bff, transparent);
            margin: 16px 0 12px;
            border-radius: 2px;
        }

        .desc {
            font-size: 1.05rem;
            color: #9bb0d8;
            max-width: 360px;
            line-height: 1.65;
            margin-bottom: 28px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #3d7fff, #2a5fd4);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            padding: 13px 26px;
            border-radius: 10px;
            text-decoration: none;
            transition: all 0.25s ease;
            width: fit-content;
            box-shadow: 0 4px 18px rgba(61, 127, 255, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 26px rgba(61, 127, 255, 0.45);
            background: linear-gradient(135deg, #4d8fff, #3d7fff);
        }

        /* ===== RIGHT (SLEEPING CAT) ===== */
        .right {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cat-scene {
            position: relative;
            width: 280px;
            height: 220px;
        }

        /* soft glow under cat */
        .cat-glow {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 40px;
            background: radial-gradient(ellipse, rgba(120, 160, 255, 0.18), transparent 70%);
            border-radius: 50%;
            filter: blur(8px);
        }

        /* body */
        .cat-body {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            height: 90px;
            background: #f0d5b8;
            border-radius: 80px 80px 50px 50px;
            box-shadow: inset -12px -8px 0 #e4c4a0;
        }

        /* head */
        .cat-head {
            position: absolute;
            bottom: 95px;
            left: 50%;
            transform: translateX(-42%);
            width: 95px;
            height: 85px;
            background: #f0d5b8;
            border-radius: 50% 50% 45% 45%;
            box-shadow: inset -8px -6px 0 #e4c4a0;
            z-index: 2;
        }

        /* ears */
        .ear {
            position: absolute;
            top: -18px;
            width: 32px;
            height: 38px;
            background: #f0d5b8;
            border-radius: 50% 50% 0 0;
        }

        .ear-left {
            left: 8px;
            transform: rotate(-18deg);
            box-shadow: inset -4px 0 0 #e4c4a0;
        }

        .ear-right {
            right: 8px;
            transform: rotate(18deg);
            box-shadow: inset 4px 0 0 #e4c4a0;
        }

        .ear-inner {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 18px;
            background: #f8c4c4;
            border-radius: 50% 50% 0 0;
        }

        /* closed eyes (sleeping) */
        .eye {
            position: absolute;
            top: 38px;
            width: 18px;
            height: 3px;
            background: #5a4030;
            border-radius: 4px;
        }

        .eye-left { left: 22px; }
        .eye-right { right: 22px; }

        /* nose */
        .nose {
            position: absolute;
            top: 48px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 7px;
            background: #e89a9a;
            border-radius: 50% 50% 40% 40%;
        }

        /* whiskers */
        .whisker {
            position: absolute;
            top: 52px;
            width: 28px;
            height: 1.5px;
            background: #c9a88a;
            border-radius: 2px;
        }

        .whisker-l1 { left: -18px; transform: rotate(-8deg); }
        .whisker-l2 { left: -20px; top: 58px; transform: rotate(6deg); }
        .whisker-r1 { right: -18px; transform: rotate(8deg); }
        .whisker-r2 { right: -20px; top: 58px; transform: rotate(-6deg); }

        /* tail */
        .tail {
            position: absolute;
            bottom: 55px;
            right: 28px;
            width: 70px;
            height: 18px;
            background: #f0d5b8;
            border-radius: 20px;
            transform-origin: left center;
            animation: tail-sway 4s ease-in-out infinite;
            box-shadow: inset 0 -4px 0 #e4c4a0;
        }

        /* soft zzz */
        .zzz {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 18px;
            color: #7d94c4;
            opacity: 0.7;
            animation: float-z 3s ease-in-out infinite;
            font-weight: 600;
            letter-spacing: 2px;
        }

        @keyframes tail-sway {
            0%, 100% { transform: rotate(-8deg); }
            50% { transform: rotate(12deg); }
        }

        @keyframes float-z {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.5; }
            50% { transform: translateY(-12px) scale(1.1); opacity: 0.85; }
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
                justify-content: center;
                text-align: center;
                padding: 40px 24px;
                gap: 36px;
            }
            .left { align-items: center; }
            .divider { margin: 16px auto 12px; }
            .company { font-size: 2.2rem; }
            .btn { margin: 0 auto; }
            .cat-scene { transform: scale(0.85); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left">
            <div class="company">sqservices<span>.me</span></div>
            <div class="library">Library</div>
            <div class="divider"></div>
            <p class="desc">Clean • Modern<br>my ui is built for developers.</p>
            <a href="docs.html" class="btn">Get Started →</a>
        </div>

        <div class="right">
            <div class="cat-scene">
                <div class="cat-glow"></div>
                <div class="zzz">zzz</div>
                <div class="tail"></div>
                <div class="cat-body"></div>
                <div class="cat-head">
                    <div class="ear ear-left"><div class="ear-inner"></div></div>
                    <div class="ear ear-right"><div class="ear-inner"></div></div>
                    <div class="eye eye-left"></div>
                    <div class="eye eye-right"></div>
                    <div class="nose"></div>
                    <div class="whisker whisker-l1"></div>
                    <div class="whisker whisker-l2"></div>
                    <div class="whisker whisker-r1"></div>
                    <div class="whisker whisker-r2"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
