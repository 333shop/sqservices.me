<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Browser</title>
<style>
  :root {
    --bg: #12141a;
    --tabbar: #1a1d25;
    --tab: #232733;
    --tab-active: #2f3547;
    --line: #333a4a;
    --text: #eceef2;
    --muted: #8b93a1;
    --accent: #4da3ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .tabs {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    background: var(--tabbar);
    padding: 8px 8px 0;
    overflow-x: auto;
  }
  .tab {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 120px;
    max-width: 200px;
    background: var(--tab);
    border: 0;
    border-radius: 8px 8px 0 0;
    padding: 8px 10px;
    font-size: .85rem;
    color: var(--muted);
  }
  .tab.active { background: var(--tab-active); color: var(--text); }
  .tab .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
  .tab .close { border: 0; background: transparent; color: var(--muted); padding: 0 4px; border-radius: 4px; }
  .tab .close:hover { background: rgba(255,255,255,.12); color: var(--text); }
  .newtab { border: 0; background: transparent; color: var(--muted); font-size: 1.3rem; padding: 4px 12px; border-radius: 8px; }
  .newtab:hover { background: var(--tab); color: var(--text); }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--tab-active);
    padding: 8px;
    border-bottom: 1px solid var(--line);
  }
  .toolbar .nav {
    border: 0;
    background: transparent;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    font-size: 1.05rem;
  }
  .toolbar .nav:hover:not(:disabled) { background: rgba(255,255,255,.12); }
  .toolbar .nav:disabled { color: #555c6b; cursor: default; }
  .address {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 18px;
    color: var(--text);
    font-size: .95rem;
    padding: 8px 16px;
  }
  .address:focus { border-color: var(--accent); outline: 0; }

  .viewport { position: relative; flex: 1; background: #fff; }
  .viewport iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  .viewport iframe[hidden] { display: none; }

  .home {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: var(--bg);
    padding: 24px;
    text-align: center;
  }
  .home[hidden] { display: none; }
  .home h1 { margin: 0 0 8px; font-size: 1.6rem; }
  .home p { margin: 0; color: var(--muted); max-width: 420px; }
  .note { color: var(--muted); font-size: .8rem; margin-top: 16px; }
  .note a { color: var(--accent); }
</style>
</head>
<body>

<div class="tabs" id="tabs"></div>

<div class="toolbar">
  <button class="nav" id="back" title="Back" aria-label="Back">&#8592;</button>
  <button class="nav" id="forward" title="Forward" aria-label="Forward">&#8594;</button>
  <button class="nav" id="reload" title="Reload" aria-label="Reload">&#8635;</button>
  <input class="address" id="address" type="text" placeholder="Enter a website link" autocomplete="off" spellcheck="false" aria-label="Website link">
  <button class="nav" id="external" title="Open in a new window" aria-label="Open in a new window">&#8599;</button>
</div>

<div class="viewport" id="viewport">
  <div class="home" id="home">
    <div>
      <h1>My Browser</h1>
      <p>Type a website link in the bar above and press Enter.</p>
      <p class="note">Some websites refuse to load inside other pages. If a page stays blank, use the arrow button to open it in a new window.</p>
    </div>
  </div>
</div>

<script>
  const tabsEl = document.getElementById("tabs");
  const addressEl = document.getElementById("address");
  const viewport = document.getElementById("viewport");
  const home = document.getElementById("home");
  const backBtn = document.getElementById("back");
  const forwardBtn = document.getElementById("forward");

  let tabs = [];
  let activeId = null;
  let nextId = 1;

  function normalize(raw) {
    let v = raw.trim();
    if (!v) return null;
    if (!/^https?:\/\//i.test(v)) v = "https://" + v;
    try {
      const u = new URL(v);
      if (!u.hostname.includes(".") && u.hostname !== "localhost") return null;
      return u.href;
    } catch (e) { return null; }
  }

  function getTab(id) { return tabs.find(function (t) { return t.id === id; }); }

  function newTab(url) {
    const iframe = document.createElement("iframe");
    iframe.hidden = true;
    iframe.title = "Website";
    iframe.allow = "fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture";
    iframe.setAttribute("allowfullscreen", "");
    viewport.appendChild(iframe);
    const tab = { id: nextId++, title: "New tab", history: [], index: -1, iframe: iframe };
    tabs.push(tab);
    switchTab(tab.id);
    if (url) navigate(tab, url);
    return tab;
  }

  function closeTab(id) {
    const i = tabs.findIndex(function (t) { return t.id === id; });
    if (i === -1) return;
    tabs[i].iframe.remove();
    tabs.splice(i, 1);
    if (!tabs.length) { newTab(); return; }
    if (activeId === id) switchTab(tabs[Math.max(0, i - 1)].id);
    else render();
  }

  function switchTab(id) {
    activeId = id;
    render();
    const t = getTab(id);
    if (!t.history.length) addressEl.focus();
  }

  function navigate(tab, url, fromHistory) {
    if (!fromHistory) {
      tab.history = tab.history.slice(0, tab.index + 1);
      tab.history.push(url);
      tab.index = tab.history.length - 1;
    }
    tab.iframe.src = url;
    try { tab.title = new URL(url).hostname.replace(/^www\./, ""); } catch (e) { tab.title = url; }
    render();
  }

  function render() {
    tabsEl.innerHTML = "";
    tabs.forEach(function (t) {
      const el = document.createElement("div");
      el.className = "tab" + (t.id === activeId ? " active" : "");
      el.setAttribute("role", "button");
      el.tabIndex = 0;
      const title = document.createElement("span");
      title.className = "title";
      title.textContent = t.title;
      const close = document.createElement("button");
      close.className = "close";
      close.textContent = "\u00d7";
      close.setAttribute("aria-label", "Close tab");
      close.addEventListener("click", function (e) { e.stopPropagation(); closeTab(t.id); });
      el.appendChild(title);
      el.appendChild(close);
      el.addEventListener("click", function () { switchTab(t.id); });
      el.addEventListener("keydown", function (e) { if (e.key === "Enter") switchTab(t.id); });
      tabsEl.appendChild(el);
    });
    const add = document.createElement("button");
    add.className = "newtab";
    add.textContent = "+";
    add.setAttribute("aria-label", "New tab");
    add.addEventListener("click", function () { newTab(); });
    tabsEl.appendChild(add);

    const active = getTab(activeId);
    tabs.forEach(function (t) { t.iframe.hidden = t !== active || !t.history.length; });
    home.hidden = !!(active && active.history.length);
    addressEl.value = active && active.history.length ? active.history[active.index] : "";
    backBtn.disabled = !active || active.index <= 0;
    forwardBtn.disabled = !active || active.index >= active.history.length - 1;
  }

  addressEl.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    const url = normalize(addressEl.value);
    if (!url) { addressEl.select(); return; }
    navigate(getTab(activeId), url);
  });

  backBtn.addEventListener("click", function () {
    const t = getTab(activeId);
    if (t.index > 0) { t.index--; navigate(t, t.history[t.index], true); }
  });
  forwardBtn.addEventListener("click", function () {
    const t = getTab(activeId);
    if (t.index < t.history.length - 1) { t.index++; navigate(t, t.history[t.index], true); }
  });
  document.getElementById("reload").addEventListener("click", function () {
    const t = getTab(activeId);
    if (t.history.length) t.iframe.src = t.history[t.index];
  });
  document.getElementById("external").addEventListener("click", function () {
    const t = getTab(activeId);
    if (t.history.length) window.open(t.history[t.index], "_blank", "noopener");
  });

  newTab();
</script>
</body>
</html>
