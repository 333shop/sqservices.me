
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cheats</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: linear-gradient(105deg, #ff7a00 0%, #ff5500 35%, #1a0a00 70%, #000000 100%);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #fff;
      display: flex;
      overflow: hidden;
    }

    .left {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 0 8%;
      gap: 32px;
    }

    .left h1 {
      font-size: clamp(2rem, 4vw, 3.2rem);
      font-weight: 700;
      line-height: 1.2;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      max-width: 480px;
    }

    .next-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      color: #ff5500;
      font-size: 1.15rem;
      font-weight: 600;
      padding: 16px 36px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      transition: all 0.25s ease;
    }

    .next-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      background: #fff8f0;
    }

    .next-btn:active {
      transform: translateY(0);
    }

    .right {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }

    .logo-box {
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .logo-box img {
      display: block;
      max-width: 320px;
      width: 100%;
      border-radius: 16px;
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }
      .left {
        align-items: center;
        text-align: center;
        padding: 40px 24px 20px;
      }
      .right {
        padding: 20px;
      }
      .logo-box img {
        max-width: 240px;
      }
    }
  </style>
</head>
<body>
  <div class="left">
    <h1>Click next to see all the cheats</h1>
    <a href="cheats.html" class="next-btn">Next →</a>
  </div>

  <div class="right">
    <div class="logo-box">
      <img src="logo.gif" alt="Logo">
    </div>
  </div>
</body>
</html>
