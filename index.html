<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQ Downloaded</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #080c18;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #e8eeff;
            position: relative;
        }

        /* Soft blue glow + blur background */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 30% 40%, rgba(61, 127, 255, 0.18), transparent 50%),
                radial-gradient(circle at 70% 60%, rgba(40, 90, 180, 0.15), transparent 50%),
                #080c18;
            filter: blur(40px);
            z-index: 0;
        }

        .wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        /* Glass card */
        .card {
            background: rgba(12, 16, 32, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(91, 155, 255, 0.15);
            border-radius: 20px;
            padding: 32px 28px;
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(91, 155, 255, 0.08);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 28px;
            background: rgba(8, 12, 24, 0.6);
            padding: 6px;
            border-radius: 12px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            font-size: 0.95rem;
            font-weight: 600;
            color: #7d94c4;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
            user-select: none;
        }

        .tab.active {
            background: linear-gradient(135deg, #3d7fff, #2a5fd4);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(61, 127, 255, 0.35);
        }

        .tab:hover:not(.active) {
            color: #b8c9f0;
            background: rgba(61, 127, 255, 0.08);
        }

        /* Content panels */
        .panel {
            display: none;
        }

        .panel.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .title {
            font-size: 1.55rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .title span {
            color: #5b9bff;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #7d94c4;
            margin-bottom: 24px;
        }

        /* Bubble input */
        .input-group {
            position: relative;
            margin-bottom: 18px;
        }

        .input-group input {
            width: 100%;
            padding: 16px 18px;
            background: rgba(8, 12, 24, 0.7);
            border: 1px solid rgba(91, 155, 255, 0.2);
            border-radius: 14px;
            color: #e8eeff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.25s ease;
        }

        .input-group input::placeholder {
            color: #5a6f9a;
        }

        .input-group input:focus {
            border-color: #5b9bff;
            box-shadow: 0 0 0 3px rgba(91, 155, 255, 0.15);
            background: rgba(8, 12, 24, 0.9);
        }

        /* Download button */
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #3d7fff, #2a5fd4);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 18px rgba(61, 127, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 26px rgba(61, 127, 255, 0.45);
            background: linear-gradient(135deg, #4d8fff, #3d7fff);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Status */
        .status {
            margin-top: 20px;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 600;
            min-height: 24px;
            color: #5b9bff;
            letter-spacing: 0.3px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .status.show {
            opacity: 1;
        }

        .status.success {
            color: #5bff9b;
        }

        .status.error {
            color: #ff6b8a;
        }

        /* About panel */
        .about-text {
            font-size: 0.95rem;
            color: #9bb0d8;
            line-height: 1.65;
        }

        .about-text p {
            margin-bottom: 12px;
        }

        .tag {
            display: inline-block;
            background: rgba(61, 127, 255, 0.12);
            color: #7eb6ff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            margin-right: 6px;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="card">
            <!-- Tabs -->
            <div class="tabs">
                <div class="tab active" data-tab="downloader">Downloader</div>
                <div class="tab" data-tab="about">About</div>
            </div>

            <!-- Downloader Panel -->
            <div class="panel active" id="downloader">
                <div class="title">SQ <span>Downloaded</span></div>
                <div class="subtitle">Paste a direct video link and download instantly</div>

                <div class="input-group">
                    <input
                        type="url"
                        id="videoUrl"
                        placeholder="https://example.com/video.mp4"
                        autocomplete="off"
                        spellcheck="false"
                    >
                </div>

                <button class="btn" id="downloadBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Download Video
                </button>

                <div class="status" id="status"></div>
            </div>

            <!-- About Panel -->
            <div class="panel" id="about">
                <div class="title">About</div>
                <div class="subtitle">Clean • Modern • Dark Blue</div>
                <div class="about-text">
                    <p>Simple video downloader inspired by the <strong>sqservices.me</strong> aesthetic.</p>
                    <p>Works with any direct video URL (mp4, webm, mov, etc.).</p>
                    <p style="margin-top: 16px;">
                        <span class="tag">Glassmorphism</span>
                        <span class="tag">Blur Background</span>
                        <span class="tag">Tabs</span>
                        <span class="tag">Zero Dependencies</span>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Tab switching
        const tabs = document.querySelectorAll('.tab');
        const panels = document.querySelectorAll('.panel');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                panels.forEach(p => p.classList.remove('active'));

                tab.classList.add('active');
                document.getElementById(tab.dataset.tab).classList.add('active');
            });
        });

        // Download logic
        const input = document.getElementById('videoUrl');
        const btn = document.getElementById('downloadBtn');
        const status = document.getElementById('status');

        function showStatus(text, type = '') {
            status.textContent = text;
            status.className = 'status show' + (type ? ' ' + type : '');
        }

        function downloadVideo() {
            const url = input.value.trim();

            if (!url) {
                showStatus('Please paste a video link first', 'error');
                return;
            }

            try {
                new URL(url); // basic validation
            } catch {
                showStatus('Invalid URL', 'error');
                return;
            }

            btn.disabled = true;
            showStatus('Preparing download...', '');

            // Create temporary <a> to force download
            const a = document.createElement('a');
            a.href = url;
            a.download = ''; // let browser decide filename
            a.target = '_blank';
            a.rel = 'noopener';

            // For cross-origin videos the browser may just open the file.
            // This is the cleanest pure-frontend approach.
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            setTimeout(() => {
                showStatus('SQ Downloaded', 'success');
                btn.disabled = false;
            }, 600);
        }

        btn.addEventListener('click', downloadVideo);

        // Enter key support
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                downloadVideo();
            }
        });
    </script>
</body>
</html>
