
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sqservices — Elite App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(
                135deg,
                #0a0e1a 0%,
                #0f172a 25%,
                #1e3a5f 50%,
                #0f172a 75%,
                #0a0e1a 100%
            );
            background-size: 400% 400%;
            animation: gradientShift 18s ease infinite;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #e2e8f0;
            overflow: hidden;
            position: relative;
        }

        /* Soft radial glow overlay for depth */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(
                ellipse at center,
                rgba(59, 130, 246, 0.12) 0%,
                transparent 70%
            );
            pointer-events: none;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 2rem;
            max-width: 640px;
            width: 100%;
        }

        .main-text {
            font-size: clamp(1.6rem, 4.5vw, 2.6rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.25;
            background: linear-gradient(90deg, #93c5fd, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2.5rem;
            text-shadow: 0 0 40px rgba(59, 130, 246, 0.25);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .button-wrapper {
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .install-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.95rem 2.1rem;
            font-size: 1.05rem;
            font-weight: 600;
            color: #0f172a;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 
                0 4px 20px rgba(59, 130, 246, 0.45),
                0 0 0 1px rgba(255, 255, 255, 0.08);
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .install-btn:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 8px 28px rgba(59, 130, 246, 0.55),
                0 0 0 1px rgba(255, 255, 255, 0.12);
            background: linear-gradient(135deg, #93c5fd, #60a5fa);
        }

        .install-btn:active {
            transform: translateY(0);
        }

        .install-btn svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .chrome-note {
            margin-top: 1.4rem;
            font-size: 0.85rem;
            color: #94a3b8;
            letter-spacing: 0.01em;
        }

        /* Hidden state after install */
        .hidden {
            opacity: 0;
            transform: translateY(12px);
            pointer-events: none;
            position: absolute;
            visibility: hidden;
        }

        .result-text {
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(90deg, #93c5fd, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            opacity: 0;
            transform: translateY(16px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .result-text.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="main-text" id="mainText">
            sqservices is best elite app out there
        </h1>

        <div class="button-wrapper" id="buttonArea">
            <button class="install-btn" id="installBtn" onclick="handleInstall()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                Add as Chrome App
            </button>
            <p class="chrome-note">Only supported on Google Chrome</p>
        </div>

        <div class="result-text" id="resultText">
            test html and css
        </div>
    </div>

    <script>
        function handleInstall() {
            const mainText = document.getElementById('mainText');
            const buttonArea = document.getElementById('buttonArea');
            const resultText = document.getElementById('resultText');

            // Smooth fade out
            mainText.classList.add('hidden');
            buttonArea.classList.add('hidden');

            
            setTimeout(() => {
                resultText.classList.add('visible');
            }, 380);
        }
    </script>
</body>
</html>
