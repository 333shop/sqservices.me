<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sqservices.me • Roblox Scripts &amp; Game Cheats</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Playfair+Display:wght@700&amp;display=swap');

        :root {
            --bg: #0a0a0a;
            --accent: #c026d3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0f2e 100%);
            color: white;
            font-family: 'Inter', system_ui, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Left side - dark purple fade */
        .left {
            position: fixed;
            left: 0;
            top: 0;
            width: 42%;
            height: 100vh;
            background: linear-gradient(
                90deg,
                #1a0f2e 0%,
                #2a1b4e 30%,
                #3a2a6e 60%,
                #4a3a8e 100%
            );
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 80px 60px;
            z-index: 2;
        }

        .left::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 20%, rgba(192, 38, 211, 0.15) 0%, transparent 70%);
            pointer-events: none;
        }

        .left-content {
            text-align: center;
            max-width: 380px;
            z-index: 3;
        }

        .left h1 {
            font-size: 2.1rem;
            margin-bottom: 12px;
            color: white;
        }

        .tagline {
            font-size: 1.35rem;
            line-height: 1.4;
            color: #e0d4ff;
            margin-bottom: 40px;
            opacity: 0.95;
        }

        .statement {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #c4b5fd;
            margin-bottom: 40px;
        }

        .statement strong {
            color: #f3e8ff;
        }

        .statement em {
            color: #d8b4fe;
            font-style: italic;
        }

        /* Right side - only your custom GIF + small UI panel (exactly like the screenshot) */
        .right {
            position: fixed;
            right: 0;
            top: 0;
            width: 58%;
            height: 100vh;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
            overflow: hidden;
        }

        .tree-container {
            position: relative;
            width: 420px;
            height: 420px;
        }

        .tree-container img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            filter: drop-shadow(0 0 80px rgba(192, 38, 211, 0.7));
        }

        /* Floating cherry petals */
        .petal {
            position: absolute;
            font-size: 22px;
            color: #fda4af;
            animation: float 18s linear infinite;
            z-index: 4;
            opacity: 0.8;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-200px) rotate(360deg); }
        }

        /* Your custom GIF panel (exactly like "Store Conversions" box) */
        .custom-gif-panel {
            position: absolute;
            top: 12%;
            left: 18%;
            width: 26%;
            background: rgba(15, 15, 15, 0.75);
            border: 1px solid rgba(192, 38, 211, 0.6);
            border-radius: 16px;
            padding: 22px 18px;
            box-shadow: 0 0 40px rgba(192, 38, 211, 0.5);
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .custom-gif-panel h3 {
            font-size: 1.05rem;
            color: #e0d4ff;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .custom-gif-panel .count {
            font-size: 2.1rem;
            font-weight: 700;
            color: white;
            margin-bottom: 6px;
        }

        .custom-gif-panel .date {
            font-size: 0.85rem;
            color: #a78bfa;
            margin-bottom: 14px;
        }

        .custom-gif-panel img {
            width: 100%;
            height: 148px;
            object-fit: cover;
            border-radius: 12px;
            filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.6));
            margin-bottom: 14px;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .left { width: 100%; height: auto; flex-direction: column; padding: 80px 40px; align-items: center; justify-content: center; text-align: center; }
            .right { width: 100%; height: auto; min-height: 100vh; flex-direction: column; justify-content: center; padding: 80px 20px; }
            .tree-container { width: 320px; height: 320px; }
            .custom-gif-panel { top: 10%; left: 15%; width: 32%; }
        }
    </style>
</head>
<body>

    <!-- Left side - dark purple fade -->
    <div class="left">
        <div class="left-content">
            <div style="margin-bottom: 30px;">
                <span style="font-size: 5.5rem; opacity: 0.15; font-weight: 900;">SQ</span>

    <!-- Right side - ONLY your custom GIF + small panel (no other text) -->
    <div class="right">

                 alt="cherry blossom tree" 
                 style="image-rendering: crisp-edges;">
        </div>

        <!-- Custom GIF panel - exactly like the "Store Conversions" box in your screenshot -->
        <div class="custom-gif-panel">
            <h3 style="font-size: 1.05rem; color: #e0d4ff; margin-bottom: 8px;">Store Conversions</h3>
            <div class="count" style="font-size: 2.1rem; font-weight: 700;">5,304</div>
            <div class="date" style="font-size: 0.85rem; color: #a78bfa;">1 July - 7 July</div>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQSEPWd8s0hUBULOPARIie6RUBBGfeyFpbS9t6d-6xHiw&amp;s=10" 
                 alt="cherry blossom tree" 
                 style="width: 100%; height: 148px; object-fit: cover; border-radius: 12px;">
        </div>
    </div>

    <!-- Floating cherry petals -->
    <div class="petal" style="left: 32%; top: 15%; animation-delay: 0s;">🌸</div>
    <div class="petal" style="left: 68%; top: 22%; animation-delay: 3.2s;">🌸</div>
    <div class="petal" style="left: 18%; top: 38%; animation-delay: 1.1s;">🌸</div>
    <div class="petal" style="left: 75%; top: 55%; animation-delay: 4.7s;">🌸</div>
    <div class="petal" style="left: 45%; top: 70%; animation-delay: 2.3s;">🌸</div>
    <div class="petal" style="left: 82%; top: 85%; animation-delay: 5.9s;">🌸</div>

</body>
</html>
