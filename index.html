<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hire SQ — Make Your Website Look 10x Better</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      overflow-x: hidden;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 720px;
      animation: fadeInUp 1s ease-out;
    }

    .icon-row {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .icon-box {
      width: 60px;
      height: 60px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      color: #a78bfa;
      transition: all 0.3s ease;
      animation: float 3s ease-in-out infinite;
    }

    .icon-box:nth-child(2) { animation-delay: 0.4s; }
    .icon-box:nth-child(3) { animation-delay: 0.8s; }
    .icon-box:nth-child(4) { animation-delay: 1.2s; }

    .icon-box:hover {
      background: rgba(167, 139, 250, 0.2);
      transform: translateY(-6px) scale(1.08);
      box-shadow: 0 10px 25px rgba(167, 139, 250, 0.3);
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 1rem;
      background: linear-gradient(90deg, #fff, #c4b5fd, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .highlight {
      color: #a78bfa;
      -webkit-text-fill-color: #a78bfa;
    }

    p {
      font-size: 1.15rem;
      color: #c4b5fd;
      margin-bottom: 2.5rem;
      opacity: 0.9;
      line-height: 1.6;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      color: white;
      text-decoration: none;
      font-size: 1.15rem;
      font-weight: 600;
      padding: 1rem 2.4rem;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 25px rgba(139, 92, 246, 0.4);
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: 0.5s;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 12px 35px rgba(139, 92, 246, 0.55);
    }

    .btn:active {
      transform: translateY(-1px) scale(0.98);
    }

    .btn i {
      font-size: 1.25rem;
    }

    /* Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* Soft floating particles in background */
    .particle {
      position: fixed;
      width: 8px;
      height: 8px;
      background: rgba(167, 139, 250, 0.4);
      border-radius: 50%;
      pointer-events: none;
      animation: rise 12s linear infinite;
    }

    @keyframes rise {
      0% {
        transform: translateY(100vh) scale(0.5);
        opacity: 0;
      }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Background particles -->
  <div class="particle" style="left: 10%; animation-delay: 0s;"></div>
  <div class="particle" style="left: 25%; animation-delay: 2s; width: 6px; height: 6px;"></div>
  <div class="particle" style="left: 40%; animation-delay: 4s;"></div>
  <div class="particle" style="left: 60%; animation-delay: 1s; width: 10px; height: 10px;"></div>
  <div class="particle" style="left: 75%; animation-delay: 3s;"></div>
  <div class="particle" style="left: 90%; animation-delay: 5s; width: 7px; height: 7px;"></div>

  <div class="container">
    <div class="icon-row">
      <div class="icon-box"><i class="fas fa-code"></i></div>
      <div class="icon-box"><i class="fas fa-palette"></i></div>
      <div class="icon-box"><i class="fas fa-rocket"></i></div>
      <div class="icon-box"><i class="fas fa-magic"></i></div>
    </div>

    <h1>Hire <span class="highlight">SQ</span> to make your website look <span class="highlight">10x better</span></h1>
    
    <p>Clean designs • Smooth animations • Modern UI that actually converts</p>

    <a href="https://discord.gg/fxZ3VgZRc" class="btn" target="_blank" rel="noopener">
      <i class="fab fa-discord"></i>
      Get Started
    </a>
  </div>

</body>
</html>
