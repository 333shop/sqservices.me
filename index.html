<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cheats</title>
  <style>
    :root {
      --orange: #ff5500;
      --orange-light: #ff7a00;
      --ink: #1a0a00;
      --white: #fff;
      --cream: #fff8f0;
      --radius-box: 32px;
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      background: #000;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(105deg, var(--orange-light) 0%, var(--orange) 35%, var(--ink) 70%, #000 100%);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--white);
      display: flex;
      overflow-x: hidden;
    }

    /* ---------- Left: headline + button ---------- */
    .left {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      gap: 32px;
      padding: 40px 6% 40px 8%;
    }

    .left h1 {
      max-width: 14ch;
      font-size: clamp(2.25rem, 4.5vw, 3.75rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .next-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 40px;
      border-radius: 50px;
      background: var(--white);
      color: var(--orange);
      font-size: 1.15rem;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .next-btn:hover {
      transform: translateY(-3px);
      background: var(--cream);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

    .next-btn:active {
      transform: translateY(0);
    }

    .next-btn:focus-visible {
      outline: 3px solid var(--white);
      outline-offset: 4px;
    }

    /* ---------- Right: showcase box ---------- */
    .right {
      flex: 1.25;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 6% 40px 2%;
    }

    .logo-box {
      position: relative;
      width: min(100%, 640px);
      padding: clamp(20px, 3vw, 40px);
      border-radius: var(--radius-box);
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.12);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.55),
        0 0 0 8px rgba(255, 255, 255, 0.03),
        0 0 90px rgba(255, 122, 0, 0.25);
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    .logo-box:hover {
      transform: translateY(-6px) scale(1.015);
      box-shadow:
        0 40px 100px rgba(0, 0, 0, 0.6),
        0 0 0 8px rgba(255, 255, 255, 0.05),
        0 0 120px rgba(255, 122, 0, 0.4);
    }

    .logo-box img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 20px;
    }

    /* ---------- Mobile / tablet ---------- */
    @media (max-width: 860px) {
      body {
        flex-direction: column;
      }

      .left {
        align-items: center;
        text-align: center;
        padding: 48px 24px 16px;
        gap: 24px;
      }

      .left h1 {
        max-width: 18ch;
      }

      .right {
        flex: none;
        padding: 16px 20px 48px;
      }

      .logo-box {
        width: min(100%, 520px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="left">
    <h1>Click next to see all the cheats</h1>
    <a href="cheats.html" class="next-btn">Next →</a>
  </main>

  <section class="right" aria-label="Showcase">
    <div class="logo-box">
      <img src="logo.gif" alt="Logo">
    </div>
  </section>
</body>
</html>
