<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wyvern</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg"></div>

  <nav class="nav">
    <div class="brand">
      <img src="logo.gif" alt="Wyvern">
      <span>Wyvern</span>
    </div>
  </nav>

  <section class="hero">
    <h1>Wyvern is the best<br><span>cheat services</span> out there</h1>
    <p>Unique software that provides great functionality and easy customization, with a fast and friendly support team.</p>
  </section>

  <section class="showcase">
    <div class="showcase-track">

      <!-- First set - put your files in /media folder -->
      <div class="card"><img src="media/1.jpg" alt="Gameplay"></div>
      <div class="card"><img src="media/2.jpg" alt="Gameplay"></div>
      <div class="card"><video src="media/3.mp4" autoplay muted loop playsinline></video></div>
      <div class="card"><img src="media/4.jpg" alt="Gameplay"></div>
      <div class="card"><video src="media/5.mp4" autoplay muted loop playsinline></video></div>
      <div class="card"><img src="media/6.jpg" alt="Gameplay"></div>

      <!-- Duplicate set (must be identical for perfect loop) -->
      <div class="card"><img src="media/1.jpg" alt="Gameplay"></div>
      <div class="card"><img src="media/2.jpg" alt="Gameplay"></div>
      <div class="card"><video src="media/3.mp4" autoplay muted loop playsinline></video></div>
      <div class="card"><img src="media/4.jpg" alt="Gameplay"></div>
      <div class="card"><video src="media/5.mp4" autoplay muted loop playsinline></video></div>
      <div class="card"><img src="media/6.jpg" alt="Gameplay"></div>

    </div>
  </section>
</body>
</html>
