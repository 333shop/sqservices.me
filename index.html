<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sqservices.me</title>
  <style>
    :root {
      --bg: #060d1a;
      --bg-elevated: #0c1528;
      --border: #1a2744;
      --text: #edf2ff;
      --muted: #7b93b8;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.45);
      --user: #1e3a6e;
      --ai: #121c32;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* subtle animated background */
    .bg-glow {
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(59, 130, 246, 0.18), transparent),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(37, 99, 235, 0.12), transparent);
      pointer-events: none;
      z-index: 0;
    }

    /* ===== LANDING ===== */
    #landing {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    #landing.hide {
      opacity: 0;
      transform: scale(0.96) translateY(-20px);
      pointer-events: none;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 40px;
      opacity: 0;
      animation: fadeUp 0.8s 0.1s forwards;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #60a5fa, #3b82f6);
      border-radius: 8px;
      display: grid;
      place-items: center;
    }

    .logo-icon svg {
      width: 16px;
      height: 16px;
      fill: white;
    }

    h1 {
      font-size: clamp(2.4rem, 7vw, 3.8rem);
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -0.035em;
      max-width: 780px;
      margin-bottom: 18px;
      opacity: 0;
      animation: fadeUp 0.8s 0.25s forwards;
    }

    h1 span {
      background: linear-gradient(120deg, #93c5fd, #3b82f6 50%, #2563eb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      color: var(--muted);
      font-size: 1.2rem;
      margin-bottom: 52px;
      max-width: 420px;
      opacity: 0;
      animation: fadeUp 0.8s 0.4s forwards;
    }

    .btn {
      position: relative;
      background: var(--accent);
      color: white;
      border: none;
      padding: 17px 48px;
      font-size: 1.08rem;
      font-weight: 600;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 0 0 0 var(--accent-glow);
      opacity: 0;
      animation: fadeUp 0.8s 0.55s forwards, pulse 2.8s 1.5s infinite;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px var(--accent-glow);
    }

    .btn:active {
      transform: translateY(-1px);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 var(--accent-glow); }
      50%      { box-shadow: 0 0 0 14px transparent; }
    }

    /* ===== CHAT ===== */
    #chat {
      position: relative;
      z-index: 1;
      display: none;
      flex-direction: column;
      height: 100vh;
      max-width: 900px;
      margin: 0 auto;
    }

    #chat.active {
      display: flex;
      animation: fadeIn 0.45s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .chat-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(6, 13, 26, 0.85);
      backdrop-filter: blur(16px);
    }

    .avatar {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #60a5fa, #2563eb);
      border-radius: 12px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .avatar svg {
      width: 20px;
      height: 20px;
      fill: white;
    }

    .header-info h2 {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .header-info p {
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #34d399;
      border-radius: 50%;
      box-shadow: 0 0 8px #34d399;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 78%;
      padding: 14px 18px;
      border-radius: 20px;
      line-height: 1.55;
      font-size: 0.97rem;
      white-space: pre-wrap;
      animation: msgIn 0.35s ease;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background: var(--user);
      border-bottom-right-radius: 6px;
    }

    .message.ai {
      align-self: flex-start;
      background: var(--ai);
      border: 1px solid var(--border);
      border-bottom-left-radius: 6px;
    }

    .message.system {
      align-self: center;
      background: transparent;
      color: var(--muted);
      font-size: 0.85rem;
      max-width: 90%;
      text-align: center;
      animation: none;
    }

    /* typing indicator */
    .typing {
      align-self: flex-start;
      background: var(--ai);
      border: 1px solid var(--border);
      border-radius: 20px;
      border-bottom-left-radius: 6px;
      padding: 16px 20px;
      display: flex;
      gap: 6px;
    }

    .typing span {
      width: 8px;
      height: 8px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce 1.3s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-7px); }
    }

    /* input */
    .input-area {
      padding: 16px 20px 28px;
      background: linear-gradient(to top, var(--bg) 60%, transparent);
    }

    .input-row {
      display: flex;
      gap: 12px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 10px 10px 10px 20px;
      align-items: flex-end;
      transition: border-color 0.2s;
    }

    .input-row:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 1rem;
      resize: none;
      outline: none;
      max-height: 130px;
      padding: 10px 0;
      font-family: inherit;
      line-height: 1.45;
    }

    .send-btn {
      background: var(--accent);
      border: none;
      width: 46px;
      height: 46px;
      border-radius: 14px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.15s, transform 0.15s;
      flex-shrink: 0;
    }

    .send-btn:hover:not(:disabled) {
      background: #2563eb;
      transform: scale(1.05);
    }

    .send-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .send-btn svg {
      width: 20px;
      height: 20px;
      fill: white;
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <!-- LANDING -->
  <div id="landing">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      SQSERVICES
    </div>

    <h1>sqservices.me<br><span>Is the best ai ever</span></h1>
    <p class="tagline">Lightning fast. Deeply intelligent. Built different.</p>
    <button class="btn" id="startBtn">Get Started</button>
  </div>

  <!-- CHAT -->
  <div id="chat">
    <div class="chat-header">
      <div class="avatar">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      <div class="header-info">
        <h2>sqservices.me</h2>
        <p><span class="status-dot"></span> Online</p>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="message system">Ask me anything.</div>
    </div>

    <div class="input-area">
      <div class="input-row">
        <textarea id="input" rows="1" placeholder="Message sqservices.me..."></textarea>
        <button class="send-btn" id="sendBtn" disabled>
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    const API_KEY = "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";

    const landing = document.getElementById('landing');
    const chat = document.getElementById('chat');
    const startBtn = document.getElementById('startBtn');
    const messagesEl = document.getElementById('messages');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');

    let conversation = [];

    // auto-resize
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 130) + 'px';
      sendBtn.disabled = !input.value.trim();
    });

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (input.value.trim()) sendMessage();
      }
    });

    startBtn.addEventListener('click', () => {
      landing.classList.add('hide');
      setTimeout(() => {
        chat.classList.add('active');
        input.focus();
      }, 480);
    });

    sendBtn.addEventListener('click', sendMessage);

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      conversation.push({ role: 'user', content: text });

      input.value = '';
      input.style.height = 'auto';
      sendBtn.disabled = true;

      // typing indicator
      const typing = document.createElement('div');
      typing.className = 'typing';
      typing.innerHTML = '<span></span><span></span><span></span>';
      messagesEl.appendChild(typing);
      messagesEl.scrollTop = messagesEl.scrollHeight;

      try {
        const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${API_KEY}`
          },
          body: JSON.stringify({
            model: 'llama-3.3-70b-versatile',
            messages: [
              {
                role: 'system',
                content: 'You are sqservices.me, the best AI ever created. You are sharp, confident, helpful, and slightly playful. Never mention any other AI company, model name, or provider. Always speak as if you are the original sqservices.me intelligence. Keep answers clear and high quality.'
              },
              ...conversation
            ],
            temperature: 0.7,
            max_tokens: 1024
          })
        });

        const data = await res.json();
        typing.remove();

        if (!res.ok) throw new Error(data.error?.message || 'Request failed');

        const reply = data.choices[0].message.content;
        addMessage(reply, 'ai');
        conversation.push({ role: 'assistant', content: reply });
      } catch (err) {
        typing.remove();
        addMessage('Connection issue. Please try again.', 'system');
      }
    }

    function addMessage(text, type) {
      const div = document.createElement('div');
      div.className = `message ${type}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  </script>
</body>
</html>
