<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQ Services</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(180deg, 
                #4da6ff 0%, 
                #2a7de1 25%, 
                #1a4a8a 55%, 
                #0d1b2a 80%, 
                #000000 100%
            );
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
            overflow: hidden;
            color: white;
        }

        /* Left promotional text */
        .left-side {
            max-width: 480px;
            z-index: 2;
        }

        .left-side h1 {
            font-size: 3.4rem;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -1px;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
        }

        .left-side h1 span {
            background: linear-gradient(90deg, #7ec8ff, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .left-side p {
            margin-top: 18px;
            font-size: 1.15rem;
            opacity: 0.85;
            font-weight: 400;
            line-height: 1.5;
        }

        /* Right UI Panel - exact structure from image */
        .ui-panel {
            width: 340px;
            background: #0f172a;
            border-radius: 16px;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(255, 255, 255, 0.05);
            overflow: hidden;
            position: relative;
            z-index: 2;
        }

        /* Header */
        .panel-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 18px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .logo {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #1e3a8a, #0f172a);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(96, 165, 250, 0.3);
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.25);
        }

        .logo svg {
            width: 22px;
            height: 22px;
        }

        .panel-title {
            font-size: 15px;
            font-weight: 600;
            color: #e2e8f0;
            letter-spacing: 0.3px;
        }

        /* Navigation area */
        .panel-nav {
            padding: 14px 16px 18px;
        }

        /* Top Home buttons row */
        .home-row {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
        }

        .nav-btn {
            flex: 1;
            padding: 9px 0;
            border-radius: 8px;
            border: none;
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            background: transparent;
            color: #94a3b8;
        }

        .nav-btn.active {
            background: #1e293b;
            color: #f1f5f9;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
        }

        .nav-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.04);
            color: #cbd5e1;
        }

        /* Vertical menu items */
        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .menu-item {
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13.5px;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.18s ease;
            font-weight: 450;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #e2e8f0;
        }

        /* Subtle glow behind panel */
        .glow {
            position: absolute;
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
            top: 50%;
            right: 6%;
            transform: translateY(-50%);
            pointer-events: none;
            z-index: 1;
        }

        /* Responsive */
        @media (max-width: 900px) {
            body {
                flex-direction: column;
                justify-content: center;
                gap: 50px;
                padding: 40px 20px;
                text-align: center;
            }

            .left-side h1 {
                font-size: 2.4rem;
            }

            .ui-panel {
                width: 100%;
                max-width: 340px;
            }
        }
    </style>
</head>
<body>

    <!-- Soft blue glow behind the panel -->
    <div class="glow"></div>

    <!-- Left Side Text -->
    <div class="left-side">
        <h1>
            <span>SQ</span> is the best<br>
            cheating UI design<br>
            you can get.
        </h1>
        <p>Clean. Fast. Undetected.</p>
    </div>

    <!-- Right Side UI (exact structure from your screenshot) -->
    <div class="ui-panel">
        <!-- Header with logo + title -->
        <div class="panel-header">
            <div class="logo">
                <!-- Shield + ninja face logo -->
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3z" 
                          fill="#3b82f6" fill-opacity="0.9"/>
                    <path d="M12 7c-1.1 0-2 .9-2 2v1h-1v2h1v1c0 1.1.9 2 2 2s2-.9 2-2v-1h1v-2h-1V9c0-1.1-.9-2-2-2z" 
                          fill="#0f172a"/>
                    <circle cx="10.5" cy="11.5" r="0.7" fill="#93c5fd"/>
                    <circle cx="13.5" cy="11.5" r="0.7" fill="#93c5fd"/>
                </svg>
            </div>
            <div class="panel-title">sqservices.me</div>
        </div>

        <!-- Navigation -->
        <div class="panel-nav">
            <!-- Two Home buttons (matching the image) -->
            <div class="home-row">
                <button class="nav-btn active">Home</button>
                <button class="nav-btn">Home</button>
            </div>

            <!-- Vertical list -->
            <div class="menu-list">
                <div class="menu-item">Visuals</div>
                <div class="menu-item">Settings</div>
            </div>
        </div>
    </div>

</body>
</html>
