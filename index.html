<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sqservices.me — Roblox Scripts &amp; Real Game Cheats</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Playfair+Display:wght@700&amp;display=swap');

        :root {
            --cherry: #ff69b4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0f2e 100%);
            color: #fff;
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* LEFT SIDE - Dark Purple Fade */
        .left-panel {
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            width: 42%;
            background: linear-gradient(
                135deg,
                #1a0f2e 0%,
                #2d1b4e 40%,
                #3f2a6b 70%,
                #4a1f5e 100%
            );
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem;
            z-index: 1;
            box-shadow: 4px 0 60px rgba(0, 0, 0, 0.6);
        }

        .left-panel::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 20%, rgba(255, 105, 180, 0.15) 0%, transparent 70%);
            pointer-events: none;
            animation: purpleGlow 12s ease-in-out infinite alternate;
        }

        @keyframes purpleGlow {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .left-content {
            max-width: 480px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .left-content h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.2rem;
            line-height: 1.1;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, #ff69b4, #c026d3, #a21caf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .left-content p {
            font-size: 1.25rem;
            line-height: 1.6;
            color: #e0d4ff;
            margin-bottom: 2.5rem;
            max-width: 420px;
        }

        .left-content .tagline {
            font-size: 1.1rem;
            color: #c4b5fd;
            font-weight: 500;
            letter-spacing: 0.05em;
        }

        /* RIGHT SIDE - Cherry Blossom Tree Grid */
        .right-panel {
            position: fixed;
            right: 0;
            top: 0;
            height: 100vh;
            width: 58%;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            z-index: 2;
        }

        .right-panel::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 40% 60%, rgba(255, 105, 180, 0.08) 0%, transparent 80%);
            pointer-events: none;
        }

        .tree-container {
            width: 92%;
            height: 92%;
            position: relative;
            filter: drop-shadow(0 30px 80px rgba(0, 0, 0, 0.7));
        }

        .grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
            background-size: 28px 28px;
            opacity: 0.12;
            pointer-events: none;
        }

        .tree {
            position: absolute;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 380px;
            height: 380px;
            z-index: 10;
            animation: treeFloat 18s ease-in-out infinite;
        }

        .trunk {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 68px;
            height: 240px;
            background: linear-gradient(#4a2c1f, #2c1a12);
            border-radius: 50px 50px 0 0;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .trunk::before {
            content: '';
            position: absolute;
            top: -38px;
            left: 50%;
            transform: translateX(-50%);
            width: 98px;
            height: 98px;
            background: #3f2a1f;
            border-radius: 50%;
            box-shadow: 0 0 60px #ff69b4;
        }

        .trunk::after {
            content: '';
            position: absolute;
            top: -58px;
            left: 50%;
            transform: translateX(-50%);
            width: 128px;
            height: 128px;
            background: #4a2c1f;
            border-radius: 50%;
            opacity: 0.6;
        }

        .blossoms {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 18px;
            padding: 40px 0;
        }

        .blossom {
            width: 42px;
            height: 42px;
            background: #ff69b4;
            border-radius: 50%;
            position: relative;
            box-shadow: 
                0 0 28px #ff69b4,
                0 0 56px #ff1493,
                0 0 84px #c026d3;
            animation: blossomFloat 4s ease-in-out infinite;
        }

        .blossom::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 50%;
            opacity: 0.7;
        }

        /* Extra floating blossoms for density */
        .blossom-extra {
            position: absolute;
            animation: blossomFloat 7s ease-in-out infinite;
        }

        /* Text overlay */
        .overlay-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 20;
            pointer-events: none;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9);
        }

        .overlay-text h2 {
            font-size: 2.1rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .overlay-text p {
            font-size: 1.05rem;
            color: #e0d4ff;
            max-width: 260px;
            opacity: 0.95;
        }

        @keyframes treeFloat {
            0%, 100% { transform: translate(-50%, -48%) scale(1); }
            50% { transform: translate(-50%, -52%) scale(1.03); }
        }

        @keyframes blossomFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-18px) rotate(12deg); }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .left-panel { width: 38%; }
            .right-panel { width: 62%; }
        }

        @media (max-width: 768px) {
            .left-panel { width: 100%; height: 48vh; }
            .right-panel { width: 100%; height: 52vh; top: 48vh; }
            .left-content h1 { font-size: 2.4rem; }
            .tree { width: 260px; height: 260px; }
        }
    </style>
</head>
<body>
    <!-- LEFT PANEL -->
    <div class="left-panel">
        <div class="left-content">
            <h1>sqservices.me</h1>
            <p>A company that focuses on Roblox scripts and real game cheats</p>
            <div class="tagline">Premium • Undetected • High Quality</div>
        </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">
        <div class="tree-container">
            <!-- Background grid -->
            <div class="grid"></div>
            
            <!-- Cherry Blossom Tree -->
            <div class="tree">
                <!-- Trunk -->
                <div class="trunk"></div>
                
                <!-- Blossoms -->
                <div class="blossoms">
                    <!-- Blossom 1 -->
                    <div class="blossom" style="animation-delay: 0s;"></div>
                    <!-- Blossom 2 -->
                    <div class="blossom" style="animation-delay: 0.8s; width: 36px; height: 36px;"></div>
                    <!-- Blossom 3 -->
                    <div class="blossom" style="animation-delay: 1.6s;"></div>
                    <!-- Blossom 4 -->
                    <div class="blossom" style="animation-delay: 2.4s; width: 38px; height: 38px;"></div>
                    <!-- Blossom 5 -->
                    <div class="blossom" style="animation-delay: 0.3s;"></div>
                    <!-- Blossom 6 -->
                    <div class="blossom" style="animation-delay: 1.1s; width: 44px; height: 44px;"></div>
                    
                    <!-- Extra floating blossoms (density) -->
                    <div class="blossom blossom-extra" style="width: 28px; height: 28px; background: #ff8fab; animation-delay: 3.2s; top: 18%;"></div>
                    <div class="blossom blossom-extra" style="width: 32px; height: 32px; background: #ff69b4; animation-delay: 4.8s; top: 28%; left: 12%;"></div>
                    <div class="blossom blossom-extra" style="width: 26px; height: 26px; background: #ff1493; animation-delay: 5.6s; top: 72%; left: 8%;"></div>
                    <div class="blossom blossom-extra" style="width: 35px; height: 35px; background: #c026d3; animation-delay: 2.7s; top: 65%; right: 15%;"></div>
                    <div class="blossom blossom-extra" style="width: 30px; height: 30px; background: #ff69b4; animation-delay: 7.3s; top: 85%; right: 22%;"></div>
                    <div class="blossom blossom-extra" style="width: 24px; height: 24px; background: #ff8fab; animation-delay: 4.1s; top: 12%; left: 35%;"></div>
                </div>
            </div>
        </div>

        <!-- Overlay Text -->
        <div class="overlay-text">
            <h2>sqservices.me</h2>
            <p>Roblox scripts • Real game cheats • Premium quality</p>
        </div>
    </div>

    <script>
        // Subtle breathing animation for the whole scene (optional polish)
        let hueShift = 0;
        setInterval(() => {
            hueShift = (hueShift + 0.8) % 360;
            document.documentElement.style.setProperty('--cherry', `hsl(${hueShift}, 100%, 75%)`);
        }, 1800);
    </script>
</body>
</html>
