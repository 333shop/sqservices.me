<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat — sqservices.me</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .chat-box {
      width: 100%;
      max-width: 460px;
      height: 80vh;
      max-height: 680px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(0,0,0,0.45);
      animation: slideUp 0.45s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .chat-header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0,0,0,0.25);
    }
    .chat-header i { width: 20px; height: 20px; color: var(--accent); }
    .chat-header h1 { font-size: 1rem; font-weight: 600; margin: 0; }
    .chat-header .status { font-size: 0.78rem; color: var(--text-muted); }
    .status-dot {
      display: inline-block;
      width: 7px; height: 7px;
      background: #f59e0b;
      border-radius: 50%;
      margin-right: 5px;
      animation: pulse 1.6s infinite;
    }
    .status-dot.online { background: #22c55e; animation: none; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg { max-width: 85%; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg.system { align-self: center; max-width: 95%; }
    .msg.user { align-self: flex-end; }
    .msg.dev { align-self: flex-start; }
    .msg-bubble {
      padding: 11px 15px;
      border-radius: 16px;
      font-size: 0.93rem;
      line-height: 1.45;
    }
    .msg.system .msg-bubble {
      background: transparent;
      color: var(--text-muted);
      font-size: 0.83rem;
      text-align: center;
    }
    .msg.user .msg-bubble {
      background: var(--accent);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .msg.dev .msg-bubble {
      background: var(--bg-hover);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .chat-input {
      padding: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      background: rgba(0,0,0,0.2);
    }
    .chat-input input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      font-family: inherit;
    }
    .chat-input input:focus { border-color: var(--accent); }
    .chat-input button {
      background: var(--accent);
      border: none;
      width: 46px;
      height: 46px;
      border-radius: 12px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .chat-input button i { width: 18px; height: 18px; }
  </style>
</head>
<body>

  <div class="chat-box">
    <div class="chat-header">
      <i data-lucide="message-circle"></i>
      <div>
        <h1 id="title">Ticket</h1>
        <div class="status">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">Waiting for developer...</span>
        </div>
      </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="chat-input">
      <input type="text" id="msgInput" placeholder="Type a message..." />
      <button id="sendBtn"><i data-lucide="send"></i></button>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const params = new URLSearchParams(window.location.search);
    const ticketId = params.get("id");
    const isDevLink = params.get("dev") === "1";

    if (!ticketId) {
      window.location.href = "index.html";
    }

    let isDev = false;
    let ticket = null;

    // Load or create ticket
    const saved = localStorage.getItem("sq_ticket_" + ticketId);
    if (saved) {
      ticket = JSON.parse(saved);
    } else {
      ticket = {
        id: ticketId,
        messages: [{ from: "system", text: "Ticket not found.", time: new Date().toISOString() }]
      };
    }

    document.getElementById("title").textContent = ticketId;

    // If this is the developer link
    if (isDevLink) {
      isDev = true;
      document.getElementById("statusText").textContent = "You are the developer";
      document.getElementById("statusDot").classList.add("online");

      // Notify the customer that a developer joined
      const alreadyJoined = ticket.messages.some(m => m.text && m.text.includes("developer has joined"));
      if (!alreadyJoined) {
        ticket.messages.push({
          from: "system",
          text: "A developer has joined the chat.",
          time: new Date().toISOString()
        });
        localStorage.setItem("sq_ticket_" + ticketId, JSON.stringify(ticket));
      }
    }

    function save() {
      localStorage.setItem("sq_ticket_" + ticketId, JSON.stringify(ticket));
    }

    function render() {
      const container = document.getElementById("messages");
      container.innerHTML = "";
      (ticket.messages || []).forEach(m => {
        const div = document.createElement("div");
        div.className = "msg " + (m.from || "system");
        div.innerHTML = `<div class="msg-bubble">${escapeHtml(m.text)}</div>`;
        container.appendChild(div);
      });
      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(text) {
      const d = document.createElement("div");
      d.textContent = text || "";
      return d.innerHTML;
    }

    function sendMessage() {
      const input = document.getElementById("msgInput");
      const text = input.value.trim();
      if (!text) return;

      ticket.messages = ticket.messages || [];
      ticket.messages.push({
        from: isDev ? "dev" : "user",
        text: text,
        time: new Date().toISOString()
      });
      save();
      render();
      input.value = "";
    }

    document.getElementById("sendBtn").onclick = sendMessage;
    document.getElementById("msgInput").onkeydown = (e) => {
      if (e.key === "Enter") sendMessage();
    };

    // Keep checking for new messages (simple polling)
    setInterval(() => {
      const fresh = localStorage.getItem("sq_ticket_" + ticketId);
      if (fresh) {
        const parsed = JSON.parse(fresh);
        if (JSON.stringify(parsed.messages) !== JSON.stringify(ticket.messages)) {
          ticket = parsed;
          render();
        }
      }
    }, 1500);

    render();
  </script>
</body>
</html>
