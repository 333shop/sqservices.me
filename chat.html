<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat — sqservices.me</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .chat-container {
      width: 100%;
      max-width: 480px;
      height: 85vh;
      max-height: 700px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
      animation: slideUp 0.5s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .chat-top {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0,0,0,0.2);
    }
    .chat-top i {
      width: 22px;
      height: 22px;
      color: var(--accent);
    }
    .chat-top h1 {
      font-size: 1.1rem;
      font-weight: 600;
    }
    .chat-top span {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: #f59e0b;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg {
      max-width: 85%;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg.system {
      align-self: center;
      max-width: 95%;
    }
    .msg.user {
      align-self: flex-end;
    }
    .msg-bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.45;
    }
    .msg.system .msg-bubble {
      background: transparent;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
    }
    .msg.user .msg-bubble {
      background: var(--accent);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .chat-bottom {
      padding: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      background: rgba(0,0,0,0.15);
    }
    .chat-bottom input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      font-family: inherit;
    }
    .chat-bottom input:focus {
      border-color: var(--accent);
    }
    .chat-bottom button {
      background: var(--accent);
      border: none;
      border-radius: 12px;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      cursor: pointer;
      transition: background 0.2s;
    }
    .chat-bottom button:hover {
      background: var(--accent-hover);
    }
    .chat-bottom button i {
      width: 20px;
      height: 20px;
    }
    .back-link {
      position: absolute;
      top: 20px;
      left: 20px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .back-link:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-link">
    <i data-lucide="arrow-left"></i> Back
  </a>

  <div class="chat-container">
    <div class="chat-top">
      <i data-lucide="message-circle"></i>
      <div>
        <h1 id="ticketTitle">Ticket</h1>
        <span><span class="status-dot"></span> Waiting for a developer...</span>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="msg system">
        <div class="msg-bubble">Your ticket has been created.<br>Please wait until a developer joins the chat.</div>
      </div>
    </div>

    <div class="chat-bottom">
      <input type="text" id="msgInput" placeholder="Type a message..." disabled />
      <button id="sendBtn" disabled>
        <i data-lucide="send"></i>
      </button>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const params = new URLSearchParams(window.location.search);
    const ticketId = params.get("id") || localStorage.getItem("sq_current_ticket");

    if (!ticketId) {
      window.location.href = "index.html";
    }

    document.getElementById("ticketTitle").textContent = ticketId;

    // Load ticket info
    const saved = localStorage.getItem("sq_ticket_" + ticketId);
    if (saved) {
      const data = JSON.parse(saved);
      const messages = document.getElementById("messages");
      
      const userMsg = document.createElement("div");
      userMsg.className = "msg user";
      userMsg.innerHTML = `<div class="msg-bubble">${data.message}</div>`;
      messages.appendChild(userMsg);
    }
  </script>
</body>
</html>
