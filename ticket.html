
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ticket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-layer"></div>
  <div class="bg-fade"></div>

  <canvas id="pixel-cat" width="64" height="48"></canvas>

  <div id="app">
    <div class="card glass ticket-view">
      <div class="ticket-header">
        <span class="status-dot"></span>
        <div>
          <h2 id="ticket-title">Loading ticket...</h2>
          <p id="ticket-id" class="ticket-meta"></p>
        </div>
      </div>

      <div class="ticket-body" id="ticket-body"></div>

      <div class="ticket-actions">
        <p class="hint">This is a static ticket view. Reply to the user directly on Discord.</p>
      </div>
    </div>
  </div>

  <script src="ticket.js"></script>
</body>
</html>
