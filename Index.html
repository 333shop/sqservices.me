
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-layer"></div>
  <div class="bg-fade"></div>

  <canvas id="pixel-cat" width="64" height="48"></canvas>

  <div id="app">
    <section id="view-home" class="view active">
      <div class="card glass">
        <div class="logo">
          <span class="logo-icon">✦</span>
          <h1>Support Portal</h1>
        </div>
        <p class="subtitle">Please login or sign up, then create a ticket. We will get with you shortly :)</p>

        <form id="ticket-form" autocomplete="off">
          <div class="input-group">
            <label for="username">Your Name</label>
            <input type="text" id="username" placeholder="Enter your name" required minlength="2" maxlength="24" />
          </div>

          <div class="input-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" placeholder="What do you need help with?" required maxlength="80" />
          </div>

          <div class="input-group">
            <label for="description">Description</label>
            <textarea id="description" rows="4" placeholder="Tell us more about the issue..." required maxlength="1000"></textarea>
          </div>

          <button type="submit" class="btn primary" id="submit-btn">
            <span>Create Ticket</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
          </button>
        </form>
      </div>
    </section>

    <section id="view-success" class="view">
      <div class="card glass">
        <div class="success-icon">✓</div>
        <h2>Ticket Created!</h2>
        <p class="subtitle">Your ticket has been sent. We will get with you shortly :)</p>

        <div class="link-box">
          <p class="label">Your ticket number</p>
          <div class="ticket-number" id="ticket-number">------</div>

          <p class="label" style="margin-top:18px">Private link (save this)</p>
          <a id="ticket-link" href="#" class="ticket-url"></a>
          <button class="btn ghost" id="copy-btn">Copy Link</button>
        </div>

        <button class="btn primary" id="open-ticket-btn">Open Ticket</button>
      </div>
    </section>
  </div>

  <div id="toast" class="toast"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
