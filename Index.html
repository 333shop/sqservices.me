
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQServices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #3fa7ff;
    --blue-deep: #1f7fe0;
    --glass: rgba(8, 20, 22, 0.55);
    --line: rgba(255, 255, 255, 0.14);
    --text: #eaf4ff;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Outfit', system-ui, sans-serif;
    color: var(--text);
    background: #07100f url('background.jpg') center / cover no-repeat fixed;
    overflow-x: hidden;
  }

  nav {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: center; gap: 8px;
    padding: 18px;
    z-index: 5;
  }
  nav button {
    font: 500 1rem 'Outfit', sans-serif;
    color: var(--text);
    background: var(--glass);
    border: 1px solid var(--line);
    padding: 10px 26px;
    border-radius: 999px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: background .2s, color .2s, border-color .2s;
  }
  nav button:hover { border-color: var(--blue); }
  nav button[aria-selected="true"] {
    background: var(--blue-deep);
    border-color: var(--blue);
    color: #fff;
  }
  nav button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  section { display: none; min-height: 100vh; padding: 100px 20px 60px; }
  section.active { display: block; }

  #home.active { display: flex; align-items: center; justify-content: center; }

  .logo {
    font-weight: 700;
    font-size: clamp(3rem, 12vw, 8.5rem);
    letter-spacing: .02em;
    line-height: 1;
    background:
      linear-gradient(110deg, transparent 40%, rgba(255,255,255,.95) 50%, transparent 60%) no-repeat,
      linear-gradient(var(--blue), var(--blue));
    background-size: 250% 100%, 100% 100%;
    background-position: 160% 0, 0 0;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    filter: drop-shadow(0 4px 24px rgba(31, 127, 224, .45));
    animation: shine 5s ease-in-out infinite;
  }
  @keyframes shine {
    0%   { background-position: 160% 0, 0 0; }
    30%  { background-position: -60% 0, 0 0; }
    100% { background-position: -60% 0, 0 0; }
  }

  .panel { max-width: 760px; margin: 0 auto; }
  .panel h2 { font-weight: 700; font-size: 2.2rem; color: var(--blue); margin-bottom: 20px; }
  .cheat {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 22px;
    margin-bottom: 12px;
    backdrop-filter: blur(8px);
  }
  .cheat h3 { font-weight: 500; font-size: 1.15rem; }
  .cheat h3 small { font-weight: 300; opacity: .65; margin-left: 8px; }
  .cheat p { font-weight: 300; opacity: .8; margin-top: 4px; }
  .cheat a {
    flex-shrink: 0;
    text-decoration: none;
    color: #fff;
    background: var(--blue-deep);
    padding: 10px 20px;
    border-radius: 10px;
    font-weight: 500;
    transition: background .2s;
  }
  .cheat a:hover { background: var(--blue); }
  .empty { background: var(--glass); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }

  @media (max-width: 520px) { .cheat { flex-direction: column; align-items: flex-start; } }
  @media (prefers-reduced-motion: reduce) { .logo { animation: none; } }
</style>
</head>
<body>

<nav role="tablist">
  <button role="tab" aria-selected="true" data-tab="home">Home</button>
  <button role="tab" aria-selected="false" data-tab="cheats">Cheats</button>
</nav>

<section id="home" class="active">
  <h1 class="logo">SQServices</h1>
</section>

<section id="cheats">
  <div class="panel">
    <h2>Cheats</h2>
    <div id="list"><div class="empty">Loading…</div></div>
  </div>
</section>

<script>
  const tabs = document.querySelectorAll('nav button');
  const sections = document.querySelectorAll('section');

  function show(name) {
    tabs.forEach(t => t.setAttribute('aria-selected', t.dataset.tab === name));
    sections.forEach(s => s.classList.toggle('active', s.id === name));
    history.replaceState(null, '', '#' + name);
  }
  tabs.forEach(t => t.addEventListener('click', () => show(t.dataset.tab)));
  show(location.hash === '#cheats' ? 'cheats' : 'home');

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  fetch('cheats.json', { cache: 'no-store' })
    .then(r => r.json())
    .then(items => {
      const list = document.getElementById('list');
      if (!items.length) { list.innerHTML = '<div class="empty">No cheats uploaded yet. Check back soon.</div>'; return; }
      list.innerHTML = items.map(c => `
        <div class="cheat">
          <div>
            <h3>${esc(c.name)}${c.version ? `<small>v${esc(c.version)}</small>` : ''}</h3>
            <p>${esc(c.description)}</p>
          </div>
          <a href="${esc(c.file)}" download>Download</a>
        </div>`).join('');
    })
    .catch(() => {
      document.getElementById('list').innerHTML = '<div class="empty">Couldn’t load the cheat list. Make sure cheats.json is in the same folder as index.html.</div>';
    });
</script>
</body>
</html>
