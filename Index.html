 <html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQServices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #4aa9ff;
    --blue-deep: #2284f0;
    --glass: rgba(8, 18, 22, 0.58);
    --glass-hover: rgba(12, 28, 34, 0.72);
    --line: rgba(255, 255, 255, 0.12);
    --text: #eef6ff;
    --muted: rgba(238, 246, 255, 0.62);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Outfit', system-ui, sans-serif;
    color: var(--text);
    background: #07100f url('background.jpg') center / cover no-repeat fixed;
    overflow-x: hidden;
  }
  svg.i {
    width: 1.1em; height: 1.1em; flex-shrink: 0;
    fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }

  /* Navigation */
  nav {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 4px; padding: 5px;
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: 999px;
    backdrop-filter: blur(12px);
    z-index: 5;
  }
  nav button {
    display: flex; align-items: center; gap: 8px;
    font: 500 .95rem 'Outfit', sans-serif;
    color: var(--muted);
    background: transparent;
    border: 0;
    padding: 10px 22px;
    border-radius: 999px;
    cursor: pointer;
    transition: background .2s, color .2s;
  }
  nav button:hover { color: var(--text); }
  nav button[aria-selected="true"] { background: var(--blue-deep); color: #fff; }
  nav button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  section { display: none; min-height: 100vh; padding: 110px 20px 60px; }
  section.active { display: block; }

  /* Home */
  #home.active {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
  }
  .logo {
    font-weight: 700;
    font-size: clamp(3rem, 12vw, 8.5rem);
    letter-spacing: .02em;
    line-height: 1;
    background:
      linear-gradient(110deg, transparent 40%, rgba(255,255,255,.95) 50%, transparent 60%) no-repeat,
      linear-gradient(var(--blue), var(--blue));
    background-size: 250% 100%, 100% 100%;
    background-position: 160% 0, 0 0;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    filter: drop-shadow(0 4px 24px rgba(34, 132, 240, .45));
    animation: shine 5s ease-in-out infinite;
  }
  @keyframes shine {
    0%   { background-position: 160% 0, 0 0; }
    30%  { background-position: -60% 0, 0 0; }
    100% { background-position: -60% 0, 0 0; }
  }
  .enter {
    display: inline-flex; align-items: center; gap: 8px;
    font: 500 1rem 'Outfit', sans-serif;
    color: var(--text);
    background: var(--glass);
    border: 1px solid var(--line);
    padding: 12px 26px;
    border-radius: 999px;
    cursor: pointer;
    backdrop-filter: blur(12px);
    transition: border-color .2s, background .2s;
  }
  .enter:hover { border-color: var(--blue); background: var(--glass-hover); }
  .enter:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  /* Cheats */
  .panel { max-width: 780px; margin: 0 auto; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .head h2 { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 2rem; color: var(--blue); }
  .head h2 .count {
    font-size: .85rem; font-weight: 500; color: var(--text);
    background: var(--glass); border: 1px solid var(--line);
    padding: 3px 12px; border-radius: 999px;
  }
  .search {
    position: relative; flex: 1 1 220px; max-width: 280px;
  }
  .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .search input {
    width: 100%;
    font: 400 .95rem 'Outfit', sans-serif;
    color: var(--text);
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 11px 14px 11px 40px;
    backdrop-filter: blur(12px);
  }
  .search input::placeholder { color: var(--muted); }
  .search input:focus { outline: none; border-color: var(--blue); }

  .cheat {
    display: flex; align-items: center; gap: 16px;
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 12px;
    backdrop-filter: blur(12px);
    transition: border-color .2s, background .2s;
  }
  .cheat:hover { border-color: rgba(74, 169, 255, .55); background: var(--glass-hover); }
  .cheat .badge {
    display: grid; place-items: center;
    width: 46px; height: 46px; flex-shrink: 0;
    border-radius: 12px;
    background: rgba(74, 169, 255, .15);
    color: var(--blue);
    font-size: 1.3rem;
  }
  .cheat .info { flex: 1; min-width: 0; }
  .cheat h3 { font-weight: 500; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .cheat .ver {
    font-size: .75rem; font-weight: 500; color: var(--blue);
    border: 1px solid rgba(74, 169, 255, .4);
    padding: 1px 9px; border-radius: 999px;
  }
  .cheat p { font-weight: 300; color: var(--muted); margin-top: 3px; font-size: .95rem; }
  .cheat a.dl {
    display: inline-flex; align-items: center; gap: 8px;
    flex-shrink: 0;
    text-decoration: none;
    color: #fff;
    background: var(--blue-deep);
    padding: 10px 18px;
    border-radius: 10px;
    font-weight: 500;
    transition: background .2s;
  }
  .cheat a.dl:hover { background: var(--blue); }
  .cheat a.dl:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  .empty {
    display: flex; align-items: center; gap: 12px;
    background: var(--glass); border: 1px solid var(--line);
    border-radius: 16px; padding: 22px; color: var(--muted);
    backdrop-filter: blur(12px);
  }

  @media (max-width: 560px) {
    .cheat { flex-wrap: wrap; }
    .cheat .info { flex-basis: calc(100% - 70px); }
    .cheat a.dl { width: 100%; justify-content: center; }
    .search { max-width: none; }
  }
  @media (prefers-reduced-motion: reduce) { .logo { animation: none; } }
</style>
</head>
<body>

<!-- Icon set -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></symbol>
  <symbol id="i-zap" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16.5v.01"/></symbol>
</svg>

<nav role="tablist" aria-label="Pages">
  <button role="tab" aria-selected="true" data-tab="home"><svg class="i"><use href="#i-home"/></svg>Home</button>
  <button role="tab" aria-selected="false" data-tab="cheats"><svg class="i"><use href="#i-zap"/></svg>Cheats</button>
</nav>

<section id="home" class="active">
  <h1 class="logo">SQServices</h1>
  <button class="enter" data-tab="cheats">Browse cheats <svg class="i"><use href="#i-arrow"/></svg></button>
</section>

<section id="cheats">
  <div class="panel">
    <div class="head">
      <h2>Cheats <span class="count" id="count">0</span></h2>
      <label class="search">
        <svg class="i"><use href="#i-search"/></svg>
        <input id="q" type="search" placeholder="Search cheats" aria-label="Search cheats">
      </label>
    </div>
    <div id="list"><div class="empty"><svg class="i"><use href="#i-box"/></svg>Loading…</div></div>
  </div>
</section>

<script>
  const tabs = document.querySelectorAll('nav button');
  const sections = document.querySelectorAll('section');

  function show(name) {
    tabs.forEach(t => t.setAttribute('aria-selected', t.dataset.tab === name));
    sections.forEach(s => s.classList.toggle('active', s.id === name));
    history.replaceState(null, '', '#' + name);
    window.scrollTo(0, 0);
  }
  document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => show(b.dataset.tab)));
  show(location.hash === '#cheats' ? 'cheats' : 'home');

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icon = id => `<svg class="i"><use href="#${id}"/></svg>`;
  const list = document.getElementById('list');
  const count = document.getElementById('count');
  let cheats = [];

  function render(items) {
    count.textContent = cheats.length;
    if (!items.length) {
      list.innerHTML = `<div class="empty">${icon('i-box')}${cheats.length ? 'No cheats match your search.' : 'No cheats uploaded yet. Check back soon.'}</div>`;
      return;
    }
    list.innerHTML = items.map(c => `
      <div class="cheat">
        <div class="badge">${icon('i-zap')}</div>
        <div class="info">
          <h3>${esc(c.name)}${c.version ? `<span class="ver">v${esc(c.version)}</span>` : ''}</h3>
          <p>${esc(c.description)}</p>
        </div>
        <a class="dl" href="${esc(c.file)}" download>${icon('i-download')}Download</a>
      </div>`).join('');
  }

  document.getElementById('q').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    render(cheats.filter(c => (c.name + ' ' + (c.description || '')).toLowerCase().includes(q)));
  });

  fetch('cheats.json', { cache: 'no-store' })
    .then(r => r.json())
    .then(items => { cheats = items; render(cheats); })
    .catch(() => {
      list.innerHTML = `<div class="empty">${icon('i-alert')}Couldn’t load the cheat list. Make sure cheats.json is in the same folder as index.html.</div>`;
    });
</script>
</body>
</html>
