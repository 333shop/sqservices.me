<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – sqservices.me</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="bg-blur"></div>
  <div class="noise"></div>

  <div class="dashboard">
    <header class="dash-header">
      <a href="index.html" class="logo" style="text-decoration:none;">sq<span>services</span>.me</a>
      <div class="dash-user">
        <div class="avatar" id="avatar">U</div>
        <span id="username">User</span>
        <button class="btn-ghost" style="padding:0.4rem 0.9rem;font-size:0.85rem;" onclick="logout()">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </header>

    <main class="dash-main">
      <h1 class="section-title">Your Hosting Dashboard</h1>
      <p class="section-desc">Deploy static sites instantly. Edit anytime. Share with the world.</p>

      <div class="start-card">
        <div class="start-icon">
          <i class="fas fa-cloud-upload-alt"></i>
        </div>
        <h2>Start Hosting Now</h2>
        <p>Upload or write your code, pick a name, and get a live subdomain in seconds.</p>
        <a href="editor.html" class="btn-primary large">
          <i class="fas fa-play"></i> Start Hosting Now
        </a>
      </div>

      <div class="sites-list">
        <h3 style="font-size:1.15rem;font-weight:600;margin-bottom:1rem;">Your Sites</h3>
        <div id="sites-list"></div>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
