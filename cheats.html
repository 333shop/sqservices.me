
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Available Cheats</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #ff7a00 0%, #ff5500 25%, #1a0a00 60%, #000000 100%);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #fff;
      padding: 60px 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 700;
      margin-bottom: 12px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .subtitle {
      opacity: 0.75;
      margin-bottom: 40px;
      font-size: 1.05rem;
    }

    .file-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .file-card {
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
    }

    .file-card:hover {
      background: rgba(0, 0, 0, 0.6);
      transform: translateX(6px);
    }

    .file-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .file-icon {
      width: 42px;
      height: 42px;
      background: rgba(255, 122, 0, 0.2);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }

    .file-name {
      font-weight: 600;
      font-size: 1.05rem;
    }

    .file-type {
      font-size: 0.85rem;
      opacity: 0.6;
      margin-top: 2px;
    }

    .download-btn {
      background: #ff7a00;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s ease;
    }

    .download-btn:hover {
      background: #ff9500;
    }

    .empty {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 16px;
      padding: 50px 30px;
      text-align: center;
      opacity: 0.8;
    }

    .back {
      display: inline-block;
      margin-top: 40px;
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    .back:hover {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Available Cheats</h1>
    <p class="subtitle">Files imported by the owner appear here automatically.</p>

    <div class="file-list" id="fileList">
      <!-- Files will be injected here by JavaScript -->
    </div>

    <a href="index.html" class="back">← Back</a>
  </div>

  <script>
    // ============================================
    // OWNER: Add your .exe or .lua files here
    // Just drop the files in the same folder (or a "files/" folder)
    // and add their names below. The page will show them.
    // ============================================
    const importedFiles = [
      // Example (uncomment and edit when you add real files):
      // { name: "aimbot.exe", path: "files/aimbot.exe" },
      // { name: "esp.lua",   path: "files/esp.lua" },
      // { name: "speedhack.exe", path: "files/speedhack.exe" },
    ];

    const list = document.getElementById('fileList');

    if (importedFiles.length === 0) {
      list.innerHTML = `
        <div class="empty">
          <p style="font-size:1.2rem; margin-bottom:8px;">No files imported yet</p>
          <p style="opacity:0.7;">The owner hasn’t added any .exe or .lua files.</p>
        </div>
      `;
    } else {
      importedFiles.forEach(file => {
        const ext = file.name.split('.').pop().toLowerCase();
        const icon = ext === 'exe' ? '⚙️' : '📜';

        const card = document.createElement('div');
        card.className = 'file-card';
        card.innerHTML = `
          <div class="file-info">
            <div class="file-icon">${icon}</div>
            <div>
              <div class="file-name">${file.name}</div>
              <div class="file-type">${ext.toUpperCase()} file</div>
            </div>
          </div>
          <a href="${file.path}" class="download-btn" download>Download</a>
        `;
        list.appendChild(card);
      });
    }
  </script>
</body>
</html>
